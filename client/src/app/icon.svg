<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="pragatiLM">
  <!--
    A "p" on marker yellow.

    This was the [1] from the wordmark on its own, on the reasoning that the
    name cites itself and the citation marker is the product's whole idea. It
    is not: stripped of the wordmark beside it, a 1 in a yellow square reads as
    an unread badge, and needing a paragraph to explain a favicon means it has
    already failed. The initial says which product this tab is, which is the
    only job a favicon has.

    The yellow and ink pairing is kept, because that is `.marked`, the fill
    every cited span in the product wears, and it holds against a light and a
    dark tab strip where a monochrome mark would disappear into one of them.

    Drawn as paths rather than set as text: a favicon renders outside the page
    with no access to the webfonts, so a <text> element would fall back to
    whatever each platform happened to have.
  -->
  <rect width="32" height="32" rx="7" fill="#F2E85C" />
  <g fill="none" stroke="#101318" stroke-width="3.5" stroke-linecap="square">
    <path d="M11.4 9.6 V 25.4" />
    <circle cx="17.4" cy="15.2" r="4.6" />
  </g>
</svg>
