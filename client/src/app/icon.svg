<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="pragatiLM">
  <!--
    The wordmark cites itself: "pragatiLM" is followed by a marked [1], because
    the product's whole claim is that every statement carries a marker back to
    where it came from. The tab icon is that marker on its own.

    Marker yellow with ink on top, which is the same pairing `.marked` uses for
    every cited span in the product, so the favicon is an instance of the
    gesture rather than a logo about it. Yellow also holds its own against a
    light and a dark tab strip, which a monochrome mark would not.

    Drawn as paths rather than set as text: a favicon is rendered outside the
    page, with no access to the webfonts, so a <text> element would fall back
    to whatever the platform felt like and the numeral would differ per device.
  -->
  <rect width="32" height="32" rx="7" fill="#F2E85C" />
  <path d="M11 12.4 L14.6 8.6" stroke="#101318" stroke-width="3.4" stroke-linecap="square" />
  <rect x="14.3" y="8" width="3.6" height="16.4" fill="#101318" />
  <rect x="10" y="21.2" width="12" height="3.2" fill="#101318" />
</svg>
