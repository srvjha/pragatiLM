name: pragati

# Two networks, deliberately.
#
# pragati-backend is private: the datastores have no passwords, and the design
# assumes nothing foreign can reach them. That assumption was quietly broken
# when another product's api container was attached to this project's default
# network, which also collided on the DNS name "api" and sent roughly half of
# this API's traffic into the wrong application.
#
# caddy-edge is the shared doorway, created outside both projects so neither
# owns it. Only Caddy and the things it proxies to belong on it.
networks:
  pragati-backend:
    name: pragati-backend
  caddy-edge:
    external: true

# Production. The difference from docker-compose.yml is not the images, it is
# what is reachable: development publishes Postgres, Redis and Qdrant to the
# host because that is convenient on a laptop. On a public address it would
# mean an open database — Redis and Qdrant have no password at all, and the
# internet finds an open one within hours.
#
# So here only Caddy publishes ports. Everything else talks over the private
# network below, by service name, and cannot be reached from outside the box.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api worker

services:
  caddy:
    networks: [caddy-edge]
    image: caddy:2-alpine
    restart: unless-stopped
    # The only two ports open to the world. 80 is not for the app; it is how
    # Let's Encrypt proves the certificate belongs to this machine, and where
    # http:// visitors get redirected from.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing them, and
      # Let's Encrypt rate limits how often that can happen.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  postgres:
    networks: [pragati-backend]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-notebook_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notebook_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    networks: [pragati-backend]
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    networks: [pragati-backend]
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        ["CMD-SHELL", "bash -c 'echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Runs once and exits. The API waits for it to succeed, so a deploy that
  # ships a migration can never serve requests against the old schema.
  migrate:
    networks: [pragati-backend]
    build: .
    restart: "no"
    command: ["node", "dist/db/migrate.js"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    networks:
      pragati-backend:
      caddy-edge:
        # An explicit alias, so Caddy never has to address this by its
        # service name, which any other stack on the edge could also claim.
        aliases: [pragati-api]
    build: .
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    env_file: .env
    # No `ports:` on purpose. Caddy reaches it as http://api:4000 over the
    # private network; the internet cannot reach it at all.
    expose:
      - "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    networks: [pragati-backend]
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    # Ingestion and podcasts are long jobs; stopping mid-episode should let the
    # current step finish rather than being killed ten seconds in.
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  caddy_data:
  caddy_config:
