name: notebook-rag

# All three services are backend concerns, so this lives inside server/ and the
# client never needs it. Cloning server/ on its own gives you everything required
# to run the API: docker compose up -d, npm install, npm run dev.
#
# There is no object storage. Uploaded files, captured web pages and generated
# audio are stored as bytea in Postgres, so the system of record is exactly two
# stores: Postgres and Qdrant.

services:
  postgres:
    image: postgres:16-alpine
    container_name: notebook-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notebook_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notebook_rag"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: notebook-rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: notebook-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships no curl or wget, so the readiness endpoint is reached
      # through the bash TCP device instead.
      test:
        ["CMD-SHELL", "bash -c 'echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
